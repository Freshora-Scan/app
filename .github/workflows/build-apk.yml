# Build Freshora's Android APK on GitHub Actions.

name: Build Freshora Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: freshora-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Freshora Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      CI: "true"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "10"

    steps:
      # --------------------------------------------------
      # 1. CHECK OUT THE EXACT COMMIT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      # --------------------------------------------------
      # 2. SET UP PYTHON 3.11
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/workflows/build-apk.yml

      # --------------------------------------------------
      # 3. SET UP JAVA 17
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify toolchain versions
        run: |
          set -euxo pipefail
          python --version
          python -m pip --version
          java -version
          javac -version
          git --version

      # --------------------------------------------------
      # 4. INSTALL NATIVE BUILD DEPENDENCIES
      # --------------------------------------------------
      - name: Install system packages
        run: |
          set -euxo pipefail

          sudo apt-get -o Acquire::Retries=3 update

          sudo apt-get \
            -o Acquire::Retries=3 \
            install \
            --no-install-recommends \
            -y \
            ant \
            automake \
            autoconf \
            build-essential \
            ccache \
            cmake \
            cython3 \
            gettext \
            git \
            libbz2-dev \
            libexpat1-dev \
            libffi-dev \
            libgdbm-compat-dev \
            libgdbm-dev \
            liblzma-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libtinfo5 \
            libtool \
            make \
            pkg-config \
            python3-dev \
            uuid-dev \
            unzip \
            zip \
            zlib1g-dev

          echo "Installed native dependencies:"
          ant -version
          cmake --version
          ccache --version
          gcc --version

      # --------------------------------------------------
      # 5. INSTALL PINNED BUILDOZER TOOLING
      # --------------------------------------------------
      - name: Install Android build tools
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          # Match the setuptools version observed in the
          # previous build setup.
          python -m pip install \
            "setuptools==79.0.1" \
            wheel \
            "buildozer==1.5.0" \
            "Cython==0.29.34"

          python -m pip check
          buildozer --version
          cython --version

      # --------------------------------------------------
      # 6. CHECK REPOSITORY LAYOUT AND PYTHON SYNTAX
      # --------------------------------------------------
      - name: Validate application source
        run: |
          set -euxo pipefail

          test -s buildozer.spec
          test -s main.py
          test -s model/predict.py
          test -s model/freshora_model.tflite
          test -s model/class_names.txt

          python - <<'PY'
          import ast
          from pathlib import Path

          ignored = {
              ".git",
              ".buildozer",
              "bin",
              "venv",
              ".venv",
              "__pycache__",
              "data",
              "tests",
              "camerax_provider",
          }

          files = [
              path
              for path in Path(".").rglob("*.py")
              if not any(part in ignored for part in path.parts)
          ]

          if not files:
              raise SystemExit("No Python source files were found.")

          failures = []

          for path in sorted(files):
              try:
                  ast.parse(
                      path.read_text(encoding="utf-8-sig"),
                      filename=str(path),
                  )
              except (SyntaxError, UnicodeDecodeError) as exc:
                  failures.append(f"{path}: {exc}")

          if failures:
              print("\n".join(failures))
              raise SystemExit("Python syntax validation failed.")

          print(
              f"Python syntax validation passed "
              f"for {len(files)} files."
          )
          PY

      # --------------------------------------------------
      # 7. VALIDATE MODEL SHAPE, LABELS AND INFERENCE
      # --------------------------------------------------
      - name: Validate TFLite model
        run: |
          set -euxo pipefail

          python -m pip install \
            "numpy==1.26.4" \
            "tensorflow==2.20.0"

          python -m pip check

          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import tensorflow as tf

          model_path = Path("model/freshora_model.tflite")
          labels_path = Path("model/class_names.txt")

          if (
              not model_path.is_file()
              or model_path.stat().st_size < 100_000
          ):
              raise SystemExit(
                  "TFLite model is missing or unexpectedly small."
              )

          if not labels_path.is_file():
              raise SystemExit(
                  "model/class_names.txt is missing."
              )

          labels = [
              line.strip()
              for line in labels_path.read_text(
                  encoding="utf-8"
              ).splitlines()
              if line.strip()
          ]

          if not labels:
              raise SystemExit("The model has no class labels.")

          if len(labels) != len(set(labels)):
              raise SystemExit("Duplicate class labels were found.")

          interpreter = tf.lite.Interpreter(
              model_path=str(model_path)
          )
          interpreter.allocate_tensors()

          inputs = interpreter.get_input_details()
          outputs = interpreter.get_output_details()

          if len(inputs) != 1 or len(outputs) != 1:
              raise SystemExit(
                  f"Expected one input and one output; got "
                  f"{len(inputs)} input(s), "
                  f"{len(outputs)} output(s)."
              )

          inp = inputs[0]
          out = outputs[0]

          expected_input_shape = (1, 224, 224, 3)
          actual_input_shape = tuple(
              int(value) for value in inp["shape"]
          )

          if actual_input_shape != expected_input_shape:
              raise SystemExit(
                  f"Unexpected input shape: {actual_input_shape}; "
                  f"expected {expected_input_shape}."
              )

          if inp["dtype"] != np.float32:
              raise SystemExit(
                  f"Unexpected input dtype: {inp['dtype']}; "
                  "expected float32."
              )

          if out["dtype"] != np.float32:
              raise SystemExit(
                  f"Unexpected output dtype: {out['dtype']}; "
                  "expected float32."
              )

          output_shape = tuple(
              int(value) for value in out["shape"]
          )

          if output_shape != (1, len(labels)):
              raise SystemExit(
                  f"Output/label mismatch: "
                  f"output={output_shape}, "
                  f"labels={len(labels)}."
              )

          interpreter.set_tensor(
              inp["index"],
              np.zeros(
                  expected_input_shape,
                  dtype=np.float32,
              ),
          )

          interpreter.invoke()

          scores = interpreter.get_tensor(out["index"])

          if scores.shape != (1, len(labels)):
              raise SystemExit(
                  f"Invalid output shape: {scores.shape}."
              )

          if not np.isfinite(scores).all():
              raise SystemExit(
                  "The model returned NaN or infinite values."
              )

          print(
              "MODEL VALIDATION PASSED:",
              f"TensorFlow={tf.__version__}",
              f"labels={len(labels)}",
              f"input={actual_input_shape}",
              f"output={output_shape}",
          )
          PY

      # --------------------------------------------------
      # 8. FETCH CAMERAX HELPER
      # --------------------------------------------------
      - name: Get CameraX helper
        run: |
          set -euxo pipefail

          rm -rf camerax_provider

          git clone \
            --depth 1 \
            https://github.com/Android-for-Python/camerax_provider.git \
            camerax_provider

          test -s camerax_provider/gradle_options.py

          rm -rf camerax_provider/.git

      # --------------------------------------------------
      # 9. VERIFY NATIVE LITERT BRIDGE
      # --------------------------------------------------
      - name: Verify LiteRT Java bridge
        run: |
          set -euxo pipefail

          test -s android_src/org/freshora/ai/FreshoraTFLite.java

          grep -F \
            'android.add_src = android_src' \
            buildozer.spec

          grep -F \
            'com.google.ai.edge.litert:litert:1.4.2' \
            buildozer.spec

          grep -F \
            'org.freshora.ai.FreshoraTFLite' \
            model/predict.py

          test -s camerax_provider/gradle_options.py

          echo "LiteRT and CameraX bridge checks passed."

      # --------------------------------------------------
      # 10. CACHE ANDROID BUILD FILES
      # --------------------------------------------------
      - name: Cache Android build files
        uses: actions/cache@v5
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: freshora-android-${{ runner.os }}-py311-${{ hashFiles('buildozer.spec', 'main.py', '*.py', 'model/**/*.py', 'android_src/**/*.java', '*.kv') }}
          restore-keys: |
            freshora-android-${{ runner.os }}-py311-${{ hashFiles('buildozer.spec') }}-

      # --------------------------------------------------
      # 11. BUILD APK
      # --------------------------------------------------
      - name: Build APK
        env:
          URL_openssl: https://mirrors.ibiblio.org/openssl/source/openssl-1.1.1w.tar.gz

          URL_sdl2_image: https://www.libsdl.org/projects/SDL_image/release/SDL2_image-2.8.0.tar.gz

          URL_sdl2_mixer: https://www.libsdl.org/projects/SDL_mixer/release/SDL2_mixer-2.6.3.tar.gz

          URL_sdl2_ttf: https://www.libsdl.org/projects/SDL_ttf/release/SDL2_ttf-2.20.2.tar.gz

        run: |
          set -o pipefail

          buildozer -v android debug 2>&1 | tee buildozer.log

      # --------------------------------------------------
      # 12. VERIFY GENERATED APK
      # --------------------------------------------------
      - name: Verify generated APK
        run: |
          set -euxo pipefail

          if [ ! -d bin ]; then
            echo "::error::Buildozer did not create the bin directory."
            exit 1
          fi

          mapfile -t APKS < <(
            find bin \
              -maxdepth 1 \
              -type f \
              -name "*.apk" \
              -print | sort
          )

          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "::error::No APK was generated in bin/."
            exit 1
          fi

          APKSIGNER="$(
            find \
              "$HOME/.buildozer/android/platform/android-sdk/build-tools" \
              -type f \
              -name apksigner \
              -print -quit 2>/dev/null || true
          )"

          for apk in "${APKS[@]}"; do
            test -s "$apk"
            file "$apk"
            sha256sum "$apk"

            if [ -n "$APKSIGNER" ]; then
              "$APKSIGNER" verify --verbose "$apk"
            else
              echo "::warning::apksigner was not found; APK signature verification was skipped."
            fi
          done

          echo "APK verification completed."

      # --------------------------------------------------
      # 13. ALWAYS UPLOAD BUILD LOG
      # --------------------------------------------------
      - name: Upload Buildozer diagnostic log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Freshora-Build-Log
          path: buildozer.log
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 6

      # --------------------------------------------------
      # 14. UPLOAD APK ARTIFACT
      # --------------------------------------------------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Freshora-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # --------------------------------------------------
      # 15. PUBLISH RELEASE FOR VERSION TAGS
      # --------------------------------------------------
      - name: Publish GitHub Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: bin/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          
