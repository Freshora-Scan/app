# Build Freshora's Android APK on GitHub Actions.

name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ant git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake cython3 python3-dev python3-pip

      - name: Update system Cython
        run: |
          sudo python3 -m pip install --upgrade "Cython==3.0.12"
          /usr/bin/python3 -c "import Cython; print('System Cython:', Cython.__version__)"

      - name: Verify system dependencies
        run: |
          ant -version
          cython3 --version
          /usr/bin/python3 -c "import Cython; print('Verified Cython:', Cython.__version__)"
          test -x /usr/bin/ant

      - name: Install the matching model validation runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "tensorflow==2.20.0"

      - name: Validate the exact model and labels
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import tensorflow as tf

          model = Path("model/freshora_model.tflite")
          labels_file = Path("model/class_names.txt")

          if not model.is_file() or model.stat().st_size < 100_000:
              raise SystemExit("TFLite model is missing or unexpectedly small")

          labels = [
              x.strip()
              for x in labels_file.read_text(encoding="utf-8").splitlines()
              if x.strip()
          ]

          interpreter = tf.lite.Interpreter(model_path=str(model))
          interpreter.allocate_tensors()

          inp = interpreter.get_input_details()[0]
          out = interpreter.get_output_details()[0]

          if tuple(int(x) for x in inp["shape"]) != (1, 224, 224, 3):
              raise SystemExit(f"Unexpected input shape: {inp['shape']}")

          if inp["dtype"] != np.float32 or out["dtype"] != np.float32:
              raise SystemExit("Expected float32 input and output")

          if int(out["shape"][-1]) != len(labels):
              raise SystemExit(
                  f"Output/label mismatch: {out['shape']} vs {len(labels)}"
              )

          if len(labels) != len(set(labels)):
              raise SystemExit("Duplicate labels found")

          interpreter.set_tensor(
              inp["index"],
              np.zeros((1, 224, 224, 3), dtype=np.float32)
          )
          interpreter.invoke()

          scores = interpreter.get_tensor(out["index"])

          if scores.shape != (1, len(labels)) or not np.isfinite(scores).all():
              raise SystemExit("Invalid model output")

          labels_path = Path("model/labels.txt")

          if labels_path.exists():
              copied = [
                  x.strip()
                  for x in labels_path.read_text(encoding="utf-8").splitlines()
                  if x.strip()
              ]
              if copied != labels:
                  raise SystemExit("labels.txt mismatch")

          print(
              f"PASS: TensorFlow {tf.__version__}; "
              f"{len(labels)} labels; "
              f"input={inp['shape']}; "
              f"output={out['shape']}"
          )
          PY

      - name: Install Android build tools
        run: |
          python -m pip install "buildozer==1.5.0" "cython==0.29.34" setuptools

      - name: Get CameraX helper
        run: |
          git clone --depth 1 https://github.com/Android-for-Python/camerax_provider.git
          rm -rf camerax_provider/.git

      - name: Cache Android build tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: freshora-buildozer-py311-${{ hashFiles('buildozer.spec') }}

      - name: Verify LiteRT Java bridge configuration
        run: |
          test -f android_src/org/freshora/ai/FreshoraTFLite.java
          grep -F 'android.add_src = android_src' buildozer.spec
          grep -F 'com.google.ai.edge.litert:litert:1.4.2' buildozer.spec
          grep -F 'org.freshora.ai.FreshoraTFLite' model/predict.py
          echo "LiteRT Java bridge source and configuration are present."

      - name: Build the APK
        run: buildozer -v android debug

      - name: Verify APK and LiteRT Java bridge
        run: |
          APK="$(find bin -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "Built: $APK"
          unzip -l "$APK" | grep -E 'classes[0-9]*.dex|lib/armeabi-v7a/|lib/arm64-v8a/' | head -30

          FOUND=false
          while IFS= read -r DEX; do
            if unzip -p "$APK" "$DEX" | strings | grep -Fq 'FreshoraTFLite'; then
              FOUND=true
              break
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$' || true)

          if [ "$FOUND" != true ]; then
            echo "ERROR: FreshoraTFLite Java class is missing from the APK."
            exit 1
          fi

          echo "PASS: FreshoraTFLite is compiled into the APK."

      - name: Upload APK and exported model
        uses: actions/upload-artifact@v4
        with:
          name: freshora-apk
          path: |
            bin/*.apk
            model/freshora_model.tflite

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          
